# GLM-5.2-AWQ-INT4 on vLLM with UVA expert offloading, tensor parallelism = 4.
#
# Tune everything in .env. Do not edit this file for parameter changes.
# See README.md for the capacity math, the MTP limitation, and the risks.
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.25.1-cu129}
    container_name: glm52-vllm
    # Run an init (tini) so vLLM's mp worker subprocesses are reaped on stop.
    # Without this, `docker stop`/`down` hangs on zombie workers.
    init: true
    ipc: host
    # Bias the OOM killer toward this container (range -1000..1000). vLLM pins
    # ~108 GiB host RAM; under box-wide memory pressure this makes the kernel
    # kill vLLM first (freeing its memory) instead of locking the whole system.
    oom_score_adj: 600
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      # Mount the Hugging Face cache root read-only.
      # The snapshot files are symlinks to ../../blobs/* , so the cache root
      # must be mounted (not the snapshot directory alone) for the links to resolve.
      - ${HOST_HF_CACHE:-/raid/huggingface_pavel}:/hf:ro
    environment:
      # The model is on local disk. Stop vLLM from contacting the Hub.
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      # CUDA-graph memory-profiling reserve. 0 = reclaim the ~2.3 GiB reserve
      # for KV (correct only with --enforce-eager, which skips graph capture).
      # -1 = let vLLM auto-reserve (required when graphs are ON so capture fits).
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=${ESTIMATE_CUDAGRAPHS:-0}
      # Set VLLM_WEIGHT_OFFLOADING_DISABLE_UVA=1 to disable UVA and fall back to
      # the slow on-demand functional_call copy. Leave unset for UVA zero-copy.
    command: >
      --model ${MODEL_DIR:-/hf/models--cyankiwi--GLM-5.2-AWQ-INT4/snapshots/0baf1f00d05d19e6e01e5451ed6cc54a0a93c5f2}
      --served-model-name ${SERVED_MODEL_NAME:-glm-5.2-awq-int4}
      --tensor-parallel-size 4
      ${EP_FLAG:-}
      --decode-context-parallel-size ${DCP_SIZE:-1}
      --quantization compressed-tensors
      --hf-overrides '{"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}'
      --kv-cache-dtype fp8
      --dtype bfloat16
      --offload-backend uva
      --cpu-offload-gb ${CPU_OFFLOAD_GB:-30}
      --cpu-offload-params experts
      ${EAGER_FLAG---enforce-eager}
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.95}
      --max-model-len ${MAX_MODEL_LEN:-32768}
      --max-num-seqs ${MAX_NUM_SEQS:-64}
      --tool-call-parser glm47
      --reasoning-parser glm45
      --enable-auto-tool-choice
      --chat-template-content-format string
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ulimits:
      memlock: -1
      stack: 67108864
    restart: "no"
